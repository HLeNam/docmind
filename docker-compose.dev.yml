services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docmind_owner
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: docmind
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # minio:
  #   image: minio/minio:RELEASE.2025-04-08T15-41-24Z
  #   pull_policy: never
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - '127.0.0.1:9000:9000'
  #     - '127.0.0.1:9001:9001'
  #   environment:
  #     MINIO_ROOT_USER: docmind_owner
  #     MINIO_ROOT_PASSWORD: 123456789
  #   volumes:
  #     - minio_data:/data

  rustfs-permission-helper:
    image: alpine
    command: chown -R 10001:10001 /data /logs
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    restart: 'no'

  rustfs:
    image: rustfs/rustfs:latest # TODO: pin tag cụ thể (docker images | grep rustfs) sau khi chạy ổn
    depends_on:
      rustfs-permission-helper:
        condition: service_completed_successfully
    ports:
      # Chỉ bind 127.0.0.1, không expose ra LAN
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      RUSTFS_ACCESS_KEY: docmind_owner
      RUSTFS_SECRET_KEY: 123456789
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  # minio_data:
  redis_data:
  rustfs_data:
  rustfs_logs: